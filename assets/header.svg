<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Adil Slim: Marketing and Client Support">
  <title>Adil Slim: Marketing &amp; Client Support</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="1" stop-color="#121628"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#4f46e5" stop-opacity=".7"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#0d9488" stop-opacity=".6"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#b45309" stop-opacity=".45"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="220" rx="18"/></clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <style>
    .b1 { animation: d1 14s ease-in-out infinite alternate; }
    .b2 { animation: d2 18s ease-in-out infinite alternate; }
    .b3 { animation: d3 16s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(140px, 30px); } }
    @keyframes d2 { to { transform: translate(-160px, -20px); } }
    @keyframes d3 { to { transform: translate(-80px, 30px); } }
    .name { font: 800 64px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; letter-spacing: -2px; opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
    .role { font: 600 22px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #f3f4f8; opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .4s forwards; }
    .rot  { font: 600 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #2dd4bf; opacity: 0; animation: cycle 12s infinite; }
    .lbl  { font: 400 18px 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #a7abbd; opacity: 0; animation: up .9s cubic-bezier(.2,.8,.2,1) .7s forwards; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 4%, 22% { opacity: 1; transform: none; } 26%, 100% { opacity: 0; transform: translateY(-10px); } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 3.2s ease-in-out infinite; }
    .bar:nth-of-type(2) { animation-delay: .3s; } .bar:nth-of-type(3) { animation-delay: .6s; }
    .bar:nth-of-type(4) { animation-delay: .9s; } .bar:nth-of-type(5) { animation-delay: 1.2s; }
    @keyframes bar { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 2.4s cubic-bezier(.2,.8,.2,1) .6s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .bar { animation: none; }
      .name, .role, .lbl { animation: none; opacity: 1; }
      .line { animation: none; stroke-dashoffset: 0; }
      .rot { animation: none; } .r1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>
    <circle class="b1" cx="160" cy="60" r="200" fill="url(#g1)"/>
    <circle class="b2" cx="760" cy="80" r="190" fill="url(#g2)"/>
    <circle class="b3" cx="520" cy="230" r="150" fill="url(#g3)"/>

    <text class="name" x="48" y="96" fill="url(#txt)">Adil Slim</text>
    <text class="role" x="50" y="136">Marketing &amp; Client Support</text>
    <text class="lbl" x="50" y="174">Focused on</text>
    <text class="rot r1" x="146" y="174">campaign reporting</text>
    <text class="rot r2" x="146" y="174">customer service</text>
    <text class="rot r3" x="146" y="174">Excel &amp; Google Analytics</text>
    <text class="rot r4" x="146" y="174">web projects in HTML, CSS &amp; JS</text>

    <!-- small report card -->
    <g transform="translate(610 40)">
      <rect width="240" height="140" rx="14" fill="#1a1f33" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".09"/>
      <circle cx="18" cy="18" r="4.5" fill="#ff5f57"/><circle cx="32" cy="18" r="4.5" fill="#febc2e"/><circle cx="46" cy="18" r="4.5" fill="#28c840"/>
      <path class="line" d="M18 78 C50 72 62 58 92 60 S136 42 160 46 S200 26 222 22" fill="none" stroke="url(#txt)" stroke-width="3" stroke-linecap="round"/>
      <rect class="bar" x="24"  y="92" width="26" height="34" rx="4" fill="#818cf8"/>
      <rect class="bar" x="64"  y="92" width="26" height="34" rx="4" fill="#2dd4bf"/>
      <rect class="bar" x="104" y="92" width="26" height="34" rx="4" fill="#818cf8"/>
      <rect class="bar" x="144" y="92" width="26" height="34" rx="4" fill="#2dd4bf"/>
      <rect class="bar" x="184" y="92" width="26" height="34" rx="4" fill="#fbbf24"/>
    </g>
  </g>
</svg>
